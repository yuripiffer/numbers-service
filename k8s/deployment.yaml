# k8s/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: numbers-service
  namespace: numbers-staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: numbers-service
  template:
    metadata:
      labels:
        app: numbers-service
    spec:
      containers:
        - name: numbers-service
          image: 913704463047.dkr.ecr.eu-north-1.amazonaws.com/numbers-service:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: numbers-service
  namespace: numbers-staging
spec:
  selector:
    app: numbers-service
  ports:
    - port: 80
      targetPort: 8080
  type: LoadBalancer
